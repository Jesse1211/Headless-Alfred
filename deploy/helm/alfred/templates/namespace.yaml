{{- /*
Namespace is also covered by `helm install --create-namespace`, but
declaring it in the chart means a manual `kubectl apply -f` of the
rendered templates also works in a pinch.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    {{- include "alfred.labels" . | nindent 4 }}
