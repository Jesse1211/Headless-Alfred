{{- /*
Static auth credentials (spec §8: single user, hardcoded). The
deploy script's preflight check rejects any 'REPLACE_ME' value so
the placeholders in values.yaml never reach the cluster.

The Deployment template includes a checksum/auth annotation
referencing this Secret so a credential rotation triggers a Pod
restart (alfred-server reads env vars at startup; without the
checksum, a Secret-only change wouldn't roll the Pod).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: alfred-auth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "alfred.labels" . | nindent 4 }}
type: Opaque
stringData:
  ALFRED_USER: {{ .Values.auth.user | quote }}
  ALFRED_PASSWORD: {{ .Values.auth.password | quote }}
  ALFRED_TOKEN: {{ .Values.auth.token | quote }}
