apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfred
  namespace: alfred
  labels:
    app: alfred
spec:
  # Exactly one replica: shell state and the PVC (RWO) are process-local.
  replicas: 1
  strategy:
    # Recreate so the old Pod releases the PVC before the new one mounts it.
    type: Recreate
  selector:
    matchLabels:
      app: alfred
  template:
    metadata:
      labels:
        app: alfred
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: alfred
          image: ghcr.io/jesseliu/headless-alfred:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ALFRED_ADDR
              value: ":8080"
            - name: ALFRED_DATA_DIR
              value: "/data"
            - name: ALFRED_USER
              valueFrom:
                secretKeyRef:
                  name: alfred-secret
                  key: ALFRED_USER
            - name: ALFRED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfred-secret
                  key: ALFRED_PASSWORD
            - name: ALFRED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alfred-secret
                  key: ALFRED_TOKEN
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alfred-data
