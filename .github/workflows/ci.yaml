name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same ref when a new one is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go unit + integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tmux is required by internal/shell/tmuxio integration tests; without
      # it those tests t.Skip and we lose multi-session test coverage.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Embed the frontend dist into internal/static/dist/ so go:embed has
      # files to compile against and the static handler tests don't skip.
      - name: Build + embed frontend
        run: |
          cd web && npm ci && cd ..
          make embed-web
      - name: Run tests
        run: make test

  web:
    name: Web build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm test
      - run: cd web && npm run build

  e2e:
    name: E2E in kind
    runs-on: ubuntu-22.04
    # Only on PR — kind boot is ~90 s; keep main fast. Trigger manually if needed.
    if: github.event_name == 'pull_request'
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.23.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Provision cluster + deploy
        env:
          TEST_USER: admin
          TEST_PASSWORD: e2etest
          TEST_TOKEN: e2etesttoken
        run: make e2e-setup

      - name: Run E2E
        env:
          TEST_USER: admin
          TEST_PASSWORD: e2etest
          TEST_TOKEN: e2etesttoken
        run: make e2e

      - name: Show pod logs on failure
        if: failure()
        run: kubectl -n alfred logs deployment/alfred --tail=200 || true

      - name: Show pod state on failure
        if: failure()
        run: kubectl -n alfred describe pod -l app=alfred || true

      - name: Teardown
        if: always()
        run: make e2e-teardown
